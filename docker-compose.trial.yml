services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integration_platform
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d integration_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  controlplane:
    image: craytech/serto.controlplane:${SERTO_IMAGE_TAG:-1.4.1}
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=integration_platform;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${SERTO_JWT_ISSUER:-integration-platform}
      Jwt__Audience: ${SERTO_JWT_AUDIENCE:-integration-platform}
      Jwt__ExpiryHours: ${SERTO_JWT_EXPIRY_HOURS:-24}
      Jwt__Secret: ${JWT_SECRET}
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY}
      # Optional platform-default email sender for failure alerts (ZeptoMail).
      Zepto__Token: ${SERTO_ZEPTO_TOKEN:-}
      Zepto__FromAddress: ${SERTO_ZEPTO_FROM_ADDRESS:-}
      Zepto__FromName: ${SERTO_ZEPTO_FROM_NAME:-Serto Alerts}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
