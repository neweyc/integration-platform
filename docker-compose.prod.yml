services:
  controlplane:
    image: craytech/serto.controlplane:${SERTO_IMAGE_TAG:-1.0.3}
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${SERTO_CONTROL_PLANE_CONNECTION_STRING}
      Jwt__Issuer: ${SERTO_JWT_ISSUER:-integration-platform}
      Jwt__Audience: ${SERTO_JWT_AUDIENCE:-integration-platform}
      Jwt__ExpiryHours: ${SERTO_JWT_EXPIRY_HOURS:-24}
      Jwt__Secret: ${JWT_SECRET}
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY}
      # Optional: platform-default email sender for failure alerts (ZeptoMail). Leave blank to disable
      # the email default; tenants can still configure their own SMTP server.
      Zepto__Token: ${SERTO_ZEPTO_TOKEN:-}
      Zepto__FromAddress: ${SERTO_ZEPTO_FROM_ADDRESS:-}
      Zepto__FromName: ${SERTO_ZEPTO_FROM_NAME:-Serto Alerts}
