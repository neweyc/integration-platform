services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integration_platform
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d integration_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  controlplane:
    image: craytech/serto.controlplane:${SERTO_IMAGE_TAG:-1.0.3}
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=integration_platform;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: integration-platform
      Jwt__Audience: integration-platform
      Jwt__ExpiryHours: "24"
      Jwt__Secret: ${JWT_SECRET}
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    image: craytech/serto.agent:${SERTO_IMAGE_TAG:-1.0.3}
    profiles: ["agent"]
    environment:
      Agent__ControlPlaneUrl: ${SERTO_AGENT_CONTROL_PLANE_URL:-http://controlplane:8080}
      Agent__AgentToken: ${SERTO_AGENT_TOKEN}
      Agent__Environment: ${SERTO_AGENT_ENVIRONMENT:-production}
      Agent__IntegrationsPath: /app/integrations
      Agent__PackagesPath: /app/packages
      Agent__PollIntervalSeconds: ${SERTO_AGENT_POLL_INTERVAL_SECONDS:-30}
      Agent__PackageSyncIntervalSeconds: ${SERTO_AGENT_PACKAGE_SYNC_INTERVAL_SECONDS:-300}
      Agent__MaxConcurrentExecutions: ${SERTO_AGENT_MAX_CONCURRENT_EXECUTIONS:-5}
      Agent__ShutdownDrainSeconds: ${SERTO_AGENT_SHUTDOWN_DRAIN_SECONDS:-30}
    volumes:
      - agent_integrations:/app/integrations
      - agent_packages:/app/packages
    depends_on:
      - controlplane

volumes:
  postgres_data:
  agent_integrations:
  agent_packages:
