name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  nuget:
    name: Pack and publish NuGet packages
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Serto.slnx

      - name: Build
        # Stamp the release version into the assemblies here, not just at pack time. The pack steps
        # below use --no-build, so they set only the package version; without -p:Version on the build
        # the compiled DLLs keep the csproj placeholder (0.0.0-dev) and `serto --version` would report
        # it instead of the real release.
        run: dotnet build Serto.slnx --configuration Release --no-restore -warnaserror /nr:false -p:Version=${{ steps.version.outputs.version }}

      - name: Pack Serto.Sdk
        run: >
          dotnet pack src/Sdk/Sdk.csproj
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output ./nupkgs

      - name: Pack Serto.Connectors
        run: >
          dotnet pack src/Connectors/Connectors.csproj
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output ./nupkgs

      - name: Pack Serto.Testing
        run: >
          dotnet pack src/Testing/Testing.csproj
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output ./nupkgs

      - name: Pack Serto.Cli
        run: >
          dotnet pack src/Cli/Cli.csproj
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output ./nupkgs

      - name: Push to NuGet
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    # Only publish images once the packaged build has succeeded, so a tag never ships images
    # alongside a NuGet build that failed (e.g. on -warnaserror).
    needs: nuget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # QEMU + Buildx enable the multi-arch (linux/amd64 + linux/arm64) manifest the Dockerfiles
      # cross-compile for via $BUILDPLATFORM/TARGETARCH.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push control plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ControlPlane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            craytech/serto.controlplane:${{ steps.version.outputs.version }}
            craytech/serto.controlplane:latest

      - name: Build and push runtime agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RuntimeAgent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            craytech/serto.agent:${{ steps.version.outputs.version }}
            craytech/serto.agent:latest

  pypi:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for PyPI Trusted Publishing (no stored token)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The distribution name is serto-sdk; the import package stays `serto`. Stamp the tag version into
      # pyproject before building so the wheel/sdist carry the real release version.
      - name: Set version from tag
        run: sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml
        working-directory: sdks/python

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: sdks/python

      # Trusted Publishing: requires a one-time "pending publisher" on PyPI for repo
      # neweyc/integration-platform, workflow publish.yml. No password/secret needed.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  npm:
    name: Publish Node SDK to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        working-directory: sdks/node/serto

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: sdks/node/serto
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  go-module-tag:
    name: Tag Go SDK module
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the path-prefixed module tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go resolves a module in a subdirectory via a path-prefixed tag. Mirror the platform release tag
      # (vX.Y.Z) to sdks/go/serto/vX.Y.Z on the same commit so the module proxy serves that version. This
      # new tag does not match the v* trigger, so it won't re-run this workflow.
      - name: Create and push module tag
        run: |
          MODULE_TAG="sdks/go/serto/${GITHUB_REF_NAME}"
          git tag "$MODULE_TAG" "$GITHUB_SHA"
          git push origin "$MODULE_TAG"
