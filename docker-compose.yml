services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: integration_platform
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d integration_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  controlplane:
    build:
      context: .
      dockerfile: src/ControlPlane/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=integration_platform;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: integration-platform
      Jwt__Audience: integration-platform
      Jwt__ExpiryHours: "24"
      Jwt__Secret: ${JWT_SECRET}
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY}
      # Optional platform-default email sender for failure alerts (ZeptoMail).
      Zepto__Token: ${SERTO_ZEPTO_TOKEN:-}
      Zepto__FromAddress: ${SERTO_ZEPTO_FROM_ADDRESS:-}
      Zepto__FromName: ${SERTO_ZEPTO_FROM_NAME:-Serto Alerts}
    depends_on:
      postgres:
        condition: service_healthy
    # Readiness (/readyz) also checks database connectivity, so a "healthy" controlplane here means
    # it can actually serve work. start_period covers first-run migrations applied on startup.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
